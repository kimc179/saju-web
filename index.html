<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2030 맞춤 AI 사주 리포트</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h2>🔮 2030 맞춤 AI 사주 진로·고민 리포트</h2>
      <p class="subtitle">생년월일시와 고민을 입력하시면 AI가 맞춤 솔루션을 분석합니다.</p>
    </header>

    <!-- 사주 정보 입력 폼 -->
    <section class="form-section">
      <div class="form-group">
        <label for="name">이름 (또는 닉네임)</label>
        <input type="text" id="name" placeholder="예: 홍길동">
      </div>

      <div class="form-group">
        <label for="gender">성별</label>
        <select id="gender">
          <option value="male">남성</option>
          <option value="female">여성</option>
        </select>
      </div>

      <div class="form-group">
        <label for="birthDate">생년월일 (8자리)</label>
        <input type="text" id="birthDate" placeholder="예: 19980515">
      </div>

      <div class="form-group">
        <label for="calendarType">양력 / 음력</label>
        <select id="calendarType">
          <option value="solar">양력</option>
          <option value="lunar">음력</option>
        </select>
      </div>

      <div class="form-group">
        <label for="birthTime">태어난 시간</label>
        <input type="text" id="birthTime" placeholder="예: 14:30 또는 모름">
      </div>

      <div class="form-group">
        <label for="worry">가장 궁금한 고민 (이직, 진로, 연애 등)</label>
        <textarea id="worry" rows="3" placeholder="예: 올해 이직운과 나에게 맞는 직무 방향이 궁금합니다."></textarea>
      </div>

      <button id="submit-btn" class="submit-btn" onclick="generateReport()">AI 맞춤 리포트 분석 시작하기</button>
    </section>

    <!-- 로딩 및 대기 안내 영역 (처음에는 숨김) -->
    <section id="loading-box" style="display: none;">
      <div class="spinner"></div>
      <p id="loading-text" class="loading-msg">사주 데이터를 정밀 분석하고 있습니다...</p>
      <span class="warning-text">※ 정밀 리포트 생성 중이니 창을 닫거나 새로고침하지 마세요.</span>

      <div class="help-box">
        <p class="help-desc">
          고품질 맞춤 분석을 위해 보통 <strong>30초~1분 정도 소요</strong>됩니다.<br>
          네트워크 환경으로 인해 1~2분 이상 화면이 멈출 경우, 아래 1:1 채팅으로 남겨주시면 <strong>검수된 정밀 PDF 리포트</strong>를 즉시 발송해 드립니다.
        </p>
        <!-- 실제 오픈채팅 링크로 주소를 변경해주세요 -->
        <a href="https://open.kakao.com/o/YOUR_LINK" target="_blank" class="chat-btn">
          💬 1:1 오픈채팅으로 리포트 문의하기
        </a>
      </div>
    </section>

    <!-- 결과 리포트 출력 영역 -->
    <section id="result-box" class="result-box" style="display: none;"></section>
  </div>

  <script src="script.js"></script>
</body>
</html>
